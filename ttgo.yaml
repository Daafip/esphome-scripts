substitutions:
  hostname: "ttgo"
  devicename: ttgo
  battery_full: '3.764128'
  battery_empty: '2.492'
  battery_diff: '1'
  price_entity: sensor.vattenfall_dynamic_prices_stroom_all_in_forecast_24_uur

esphome:
  name: ttgo
  on_boot:
    priority: 800
    then:
      - lambda: |-
          // ESPHome >=2026.6 no longer sets the libc TZ env var. The babybuddy
          // lambdas parse timestamps TZ-independently now, but keep libc in the
          // right zone as a fallback for anything else that might convert time.
          // Same POSIX rule as timezone: Europe/Amsterdam below.
          setenv("TZ", "CET-1CEST,M3.5.0,M10.5.0/3", 1);
          tzset();

esp32:
  board: ttgo-t7-v14-mini32
  framework:
    type: arduino

logger:

api:
  encryption:
    key: !secret ttgo_ota_key
  actions:
    - action: babybuddy_event
      variables:
        feeding: bool
        wet: bool
        solid: bool
      then:
        - lambda: |-
            if (feeding)           id(splash_type) = 4;
            else if (wet && solid) id(splash_type) = 3;
            else if (solid)        id(splash_type) = 2;
            else                   id(splash_type) = 1;
            id(page) = 0;   // baby event -> back to the Baby Buddy page
        - script.execute:
            id: screen_wake
            duration_s: 60
        - script.execute: splash_anim
        - script.execute: fetch_babybuddy

ota:
  platform: esphome
  encryption:

wifi:
  manual_ip:
    static_ip: !secret static_ip_ttgo
    gateway: !secret gateway
    subnet: !secret subnet
  networks:
    - ssid: !secret wifi_ssid_boven
      password: !secret wifi_password_boven
    - ssid: !secret wifi_ssid
      password: !secret wifi_password
  ap:
    ssid: "${devicename} Fallback Hotspot"
    password: !secret wifi_password

#esp32_ble_tracker:
