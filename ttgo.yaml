#bluetooth_proxy:
#  active: true

# ---------- Baby Buddy display ----------
time:
  - platform: homeassistant
    id: ha_time
    timezone: Europe/Amsterdam

http_request:
  id: http_client
  useragent: "esphome-ttgo"
  timeout: 10s

switch:
  # Backlight - GPIO4 is ONLY used here, not in the display block
  - platform: gpio
    pin: GPIO4
    id: backlight
    name: "${devicename} backlight"
    restore_mode: ALWAYS_OFF

  # HA entity: enable/disable the auto-off logic
  - platform: template
    id: backlight_timeout
    name: "${devicename} backlight timeout"
    optimistic: true
    restore_mode: RESTORE_DEFAULT_ON
    entity_category: config
    on_turn_off:
      then:
        # timeouts disabled -> cancel any running timer, keep screen on
        - script.stop: screen_wake
        - switch.turn_on: backlight
    on_turn_on:
      then:
        # timeouts re-enabled -> if screen is on, give it one last minute
        - if:
            condition:
              switch.is_on: backlight
            then:
              - script.execute:
                  id: screen_wake
                  duration_s: 60

binary_sensor:
  # Top button: screen on/off
  - platform: gpio
    pin:
      number: GPIO0
      inverted: true
      ignore_strapping_warning: true
      mode:
        input: true
        pullup: true
    id: btn_top
    on_press:
      then:
        - script.execute: screen_toggle
  # Bottom button: switch page (Baby Buddy <-> prices)
  - platform: gpio
    pin:
      number: GPIO35   # input-only pin, external pullup on board
      inverted: true
    id: btn_bottom
    on_press:
      then:
        - script.execute: page_next

# ---------- Electricity prices (from HA) ----------
text_sensor:
  # "11:00-12:00 0,26\n12:00-13:00 0,23\n..." -> price_hour / price_val
  - platform: homeassistant
    id: price_forecast
    entity_id: ${price_entity}
    attribute: forecast_text
    internal: true
    on_value:
      then:
        - lambda: |-
            id(price_hour).clear();
            id(price_val).clear();
            size_t pos = 0;
            while (pos < x.size()) {
              size_t end = x.find('\n', pos);
              if (end == std::string::npos) end = x.size();
              std::string line = x.substr(pos, end - pos);
              pos = end + 1;
              int h, m;
              size_t sp = line.find(' ');
              if (sp == std::string::npos || sscanf(line.c_str(), "%d:%d", &h, &m) != 2) continue;
              std::string v = line.substr(sp + 1);
              for (auto &c : v) if (c == ',') c = '.';
              id(price_hour).push_back(h);
              id(price_val).push_back(strtof(v.c_str(), nullptr));
            }
            id(ttgo_display).update();

globals:
  - id: last_feed_ts
    type: time_t
    restore_value: yes
    initial_value: '0'
  - id: last_change_ts
    type: time_t
    restore_value: yes
    initial_value: '0'
  - id: splash_type   # 0=none 1=wet 2=solid 3=both 4=feeding
    type: int
    restore_value: no
    initial_value: '0'
  - id: splash_frame
    type: int
    restore_value: no
    initial_value: '0'
  - id: timer_start   # wall-clock start "HH:MM" of running timer, "" = none
    type: std::string
    restore_value: no
    initial_value: '""'
  - id: page          # 0=Baby Buddy 1=prices
    type: int
    restore_value: no
    initial_value: '0'
  - id: price_hour    # start hour per block, first = current hour
    type: std::vector<int>
    restore_value: no
  - id: price_val     # EUR/kWh per block
    type: std::vector<float>
    restore_value: no

script:
  # Auto-wake for events/peeks: screen on for duration_s, then off again.
  # Only acts in timeout mode; with timeouts disabled the backlight is fully
  # manual and scripts never touch it.
  - id: screen_wake
    mode: restart
    parameters:
      duration_s: int
    then:
      - if:
          condition:
            switch.is_on: backlight_timeout
          then:
            - lambda: 'id(ttgo_display).update();'   # fresh content before lighting up
            - switch.turn_on: backlight
            - delay: !lambda 'return duration_s * 1000;'
            - if:
                condition:
                  switch.is_on: backlight_timeout   # may have been disabled mid-delay
                then:
                  - switch.turn_off: backlight

  # Top button behavior:
  #  timeout on : off -> on for 1 min, on -> off immediately
  #  timeout off: plain toggle
  - id: screen_toggle
    then:
      - if:
          condition:
            switch.is_on: backlight
          then:
            - script.stop: screen_wake
            - switch.turn_off: backlight
          else:
            - if:
                condition:
                  switch.is_on: backlight_timeout
                then:
                  - script.execute:
                      id: screen_wake
                      duration_s: 60
                else:
                  # manual mode: plain on, stays on until toggled off
                  - lambda: 'id(ttgo_display).update();'
                  - switch.turn_on: backlight

  # Bottom button behavior:
  #  screen off: wake on the current page (same as the top button)
  #  screen on : next page; in timeout mode the 1-min timer restarts
  - id: page_next
    then:
      - if:
          condition:
            switch.is_on: backlight
          then:
            - lambda: |-
                id(page) = (id(page) + 1) % 2;
                id(ttgo_display).update();
            - if:
                condition:
                  switch.is_on: backlight_timeout
                then:
                  - script.execute:
                      id: screen_wake
                      duration_s: 60
          else:
            - script.execute: screen_toggle

  - id: splash_anim
    mode: restart
    then:
      - lambda: 'id(splash_frame) = 0;'
      - repeat:
          count: 25          # ~2s
          then:
            - lambda: |-
                id(splash_frame) += 1;
                id(ttgo_display).update();
            - delay: 80ms
      - lambda: |-
          id(splash_type) = 0;
          id(ttgo_display).update();

  - id: fetch_babybuddy
    mode: restart
    then:
      - http_request.get:
          url: "http://192.168.68.101:8889/api/feedings/?limit=1"
          request_headers:
            Authorization: !secret babybuddy_token
          capture_response: true
          on_response:
            then:
              - lambda: |-
                  if (response->status_code != 200) return;  // keep last known data
                  bool trigger = false;
                  json::parse_json(body, [&trigger](JsonObject root) -> bool {
                    JsonArray results = root["results"];
                    if (results.size() == 0) return true;    // keep last known data
                    JsonObject item = results[0];
                    // Epoch from wall time + the offset BabyBuddy sends (+02:00);
                    // deliberately avoids mktime()/libc TZ state, which proved
                    // unreliable when parsing from the HA service path.
                    std::string start = item["start"].as<std::string>();
                    struct tm tm{};
                    time_t prev = id(last_feed_ts);
                    const char *rest = strptime(start.c_str(), "%Y-%m-%dT%H:%M:%S", &tm);
                    if (rest != nullptr) {
                      if (*rest == '.') { rest++; while (*rest >= '0' && *rest <= '9') rest++; }
                      long off = 0;
                      if (*rest == '+' || *rest == '-') {
                        int oh = 0, om = 0;
                        sscanf(rest + 1, "%2d:%2d", &oh, &om);
                        off = ((long) oh * 60 + om) * 60;
                        if (*rest == '-') off = -off;
                      }
                      ESPTime et{};
                      et.year = tm.tm_year + 1900;
                      et.month = tm.tm_mon + 1;
                      et.day_of_month = tm.tm_mday;
                      et.hour = tm.tm_hour;
                      et.minute = tm.tm_min;
                      et.second = tm.tm_sec;
                      et.recalc_timestamp_utc(false);
                      id(last_feed_ts) = et.timestamp - off;
                      ESP_LOGD("babybuddy", "feed %s -> ts=%ld now=%ld",
                               start.c_str(), (long) id(last_feed_ts),
                               (long) id(ha_time).now().timestamp);
                    }
                    if (prev != 0 && id(last_feed_ts) > prev) {
                      id(splash_type) = 4;
                      trigger = true;
                    }
                    return true;
                  });
                  if (trigger && !id(splash_anim).is_running()) {
                    id(page) = 0;
                    id(screen_wake).execute(45);
                    id(splash_anim).execute();
                  }
      - http_request.get:
          url: "http://192.168.68.101:8889/api/changes/?limit=1"
          request_headers:
            Authorization: !secret babybuddy_token
          capture_response: true
          on_response:
            then:
              - lambda: |-
                  if (response->status_code != 200) return;  // keep last known data
                  bool trigger = false;
                  json::parse_json(body, [&trigger](JsonObject root) -> bool {
                    JsonArray results = root["results"];
                    if (results.size() == 0) return true;    // keep last known data
                    JsonObject item = results[0];
                    // see feeding lambda: epoch from wall time + explicit offset
                    std::string t = item["time"].as<std::string>();
                    struct tm tm{};
                    time_t prev = id(last_change_ts);
                    const char *rest = strptime(t.c_str(), "%Y-%m-%dT%H:%M:%S", &tm);
                    if (rest != nullptr) {
                      if (*rest == '.') { rest++; while (*rest >= '0' && *rest <= '9') rest++; }
                      long off = 0;
                      if (*rest == '+' || *rest == '-') {
                        int oh = 0, om = 0;
                        sscanf(rest + 1, "%2d:%2d", &oh, &om);
                        off = ((long) oh * 60 + om) * 60;
                        if (*rest == '-') off = -off;
                      }
                      ESPTime et{};
                      et.year = tm.tm_year + 1900;
                      et.month = tm.tm_mon + 1;
                      et.day_of_month = tm.tm_mday;
                      et.hour = tm.tm_hour;
                      et.minute = tm.tm_min;
                      et.second = tm.tm_sec;
                      et.recalc_timestamp_utc(false);
                      id(last_change_ts) = et.timestamp - off;
                      ESP_LOGD("babybuddy", "change %s -> ts=%ld now=%ld",
                               t.c_str(), (long) id(last_change_ts),
                               (long) id(ha_time).now().timestamp);
                    }
                    bool wet = item["wet"].as<bool>();
                    bool solid = item["solid"].as<bool>();
                    if (prev != 0 && id(last_change_ts) > prev) {
                      id(splash_type) = (wet && solid) ? 3 : (solid ? 2 : 1);
                      trigger = true;
                    }
                    return true;
                  });
                  if (trigger && !id(splash_anim).is_running()) {
                    id(page) = 0;
                    id(screen_wake).execute(45);
                    id(splash_anim).execute();
                  }
      - http_request.get:
          url: "http://192.168.68.101:8889/api/timers/?limit=1"
          request_headers:
            Authorization: !secret babybuddy_token
          capture_response: true
          on_response:
            then:
              - lambda: |-
                  if (response->status_code != 200) return;  // keep last known data
                  json::parse_json(body, [](JsonObject root) -> bool {
                    JsonArray results = root["results"];
                    // BabyBuddy only lists running timers: empty = no timer
                    if (results.size() == 0) {
                      id(timer_start) = "";
                      return true;
                    }
                    // "2026-07-08T15:43:11.155041+02:00" -> wall clock "15:43"
                    std::string start = results[0]["start"].as<std::string>();
                    id(timer_start) = start.size() >= 16 ? start.substr(11, 5) : "";
                    return true;
                  });

interval:
  - interval: 1min             # backup poll; HA push handles the instant case
    startup_delay: 15s
    then:
      - script.execute: fetch_babybuddy
  # Periodic peek: screen on for 30s every 10min (only in timeout mode)
  - interval: 10min
    startup_delay: 30s
    then:
      - if:
          condition:
            and:
              - switch.is_on: backlight_timeout
              - switch.is_off: backlight   # don't cut a running 1-min wake short
          then:
            - script.execute:
                id: screen_wake
                duration_s: 30

font:
  - file: "gfonts://Roboto@700"
    id: font_big
    size: 40
  - file: "gfonts://Roboto@700"
    id: font_mid       # price page header
    size: 26
  - file: "gfonts://Roboto"
    id: font_small
    size: 18
  - file: "gfonts://Roboto"
    id: font_tiny      # price page labels
    size: 12
  - file: "gfonts://Noto Emoji"
    id: font_emoji
    size: 70
    glyphs: ["💧", "💩", "🍼"]

color:
  - id: c_feed
    hex: 4FC3F7
  - id: c_change
    hex: FFB74D

spi:
  clk_pin: GPIO18
  mosi_pin: GPIO19

display:
  - platform: st7789v
    id: ttgo_display
    model: TTGO TDisplay 135x240
    backlight_pin: no
    cs_pin:
      number: GPIO5
      ignore_strapping_warning: true
    dc_pin: GPIO16
    reset_pin: GPIO23
    rotation: 90
    update_interval: 30s
    lambda: |-
      auto now = id(ha_time).now();

      // ---- splash animation (overrides any page) ----
      if (id(splash_type) != 0) {
        int cx = it.get_width() / 2;
        int y = 34 + (int)(12 * sin(id(splash_frame) * 0.6f));
        if (id(splash_type) == 3) {
          it.print(cx - 48, y, id(font_emoji), TextAlign::TOP_CENTER, "💧");
          it.print(cx + 48, y, id(font_emoji), TextAlign::TOP_CENTER, "💩");
        } else {
          const char *e = id(splash_type) == 1 ? "💧"
                        : id(splash_type) == 2 ? "💩" : "🍼";
          it.print(cx, y, id(font_emoji), TextAlign::TOP_CENTER, e);
        }
        it.print(cx, 6, id(font_small), TextAlign::TOP_CENTER,
                 id(splash_type) == 4 ? "New feeding!" : "New diaper!");
        return;
      }

      // ---- page 1: electricity prices ----
      if (id(page) == 1) {
        auto &hrs = id(price_hour);
        auto &val = id(price_val);
        const int W = it.get_width();
        if (val.empty()) {
          it.print(W / 2, it.get_height() / 2, id(font_small), TextAlign::CENTER, "no price data");
          return;
        }
        const size_t n = std::min<size_t>(val.size(), 24);
        float mn = val[0], mx = val[0];
        for (size_t i = 0; i < n; i++) { mn = std::min(mn, val[i]); mx = std::max(mx, val[i]); }

        // Same scale as the HA integration: hsl(120 -> 0, 70%, 45%) from cheapest to most expensive
        auto heat = [&](float v) -> Color {
          int hue = mx > mn ? (int) (120.0f * (mx - v) / (mx - mn)) : 120;
          float c = (1.0f - fabsf(2.0f * 0.45f - 1.0f)) * 0.70f;
          float xx = c * (1.0f - fabsf(fmodf(hue / 60.0f, 2.0f) - 1.0f));
          float m = 0.45f - c / 2.0f;
          float r = hue < 60 ? c : xx, g = hue < 60 ? xx : c;
          return Color((uint8_t) roundf((r + m) * 255), (uint8_t) roundf((g + m) * 255),
                       (uint8_t) roundf(m * 255));
        };
        auto fmt = [](float v, char *b, size_t len) {
          snprintf(b, len, "%.2f", v);
          for (char *p = b; *p; p++) if (*p == '.') *p = ',';
        };

        // header: current price (left), min/max (right)
        char b[16];
        fmt(val[0], b, sizeof(b));
        it.print(4, 0, id(font_mid), heat(val[0]), b);
        int bx, by, bw, bh;
        it.get_text_bounds(4, 0, b, id(font_mid), TextAlign::TOP_LEFT, &bx, &by, &bw, &bh);
        it.print(bx + bw + 4, 12, id(font_tiny), "EUR/kWh nu");
        fmt(mn, b, sizeof(b));
        it.printf(W - 4, 2, id(font_tiny), TextAlign::TOP_RIGHT, "min %s", b);
        fmt(mx, b, sizeof(b));
        it.printf(W - 4, 16, id(font_tiny), TextAlign::TOP_RIGHT, "max %s", b);

        // bars: fixed 24 slots so the time axis doesn't stretch
        const int top = 36, bottom = 116, left = 4, right = W - 4;
        const float lo = std::min(0.0f, mn), hi = std::max(mx, 0.01f);
        auto ymap = [&](float v) { return top + (int) ((hi - v) / (hi - lo) * (bottom - top)); };
        const float slot = (right - left) / 24.0f;
        const int barw = std::max(1, (int) slot - 2);
        const int yz = ymap(0.0f);
        for (size_t i = 0; i < n; i++) {
          int x0 = left + (int) (i * slot);
          int yv = ymap(val[i]);
          int y0 = std::min(yv, yz), h = std::max(1, std::abs(yz - yv));
          it.filled_rectangle(x0, y0, barw, h, heat(val[i]));
          if (i == 0)  // outline the current hour
            it.rectangle(x0 - 1, y0 - 1, barw + 2, h + 2, Color(255, 255, 255));
          if (hrs[i] % 3 == 0)
            it.printf(x0 + barw / 2, bottom + 3, id(font_tiny), TextAlign::TOP_CENTER, "%02d", hrs[i]);
        }
        it.horizontal_line(left, yz, right - left, Color(90, 90, 90));
        return;
      }

      // ---- page 0: Baby Buddy ----
      auto ago = [&](time_t ts, char *buf, size_t len) {
        long mins = (now.timestamp - ts) / 60;
        if (mins < 0) mins = 0;
        if (mins < 60) snprintf(buf, len, "%ld min ago", mins);
        else snprintf(buf, len, "%ldh %ldm ago", mins / 60, mins % 60);
      };
      char buf[32];
      if (!id(timer_start).empty()) {
        std::string t = "timer " + id(timer_start);
        it.print(it.get_width() - 6, 0, id(font_small), TextAlign::TOP_RIGHT, t.c_str());
      }
      it.print(6, 0, id(font_small), id(c_feed), "Feeding");
      if (id(last_feed_ts) > 0) {
        if (now.is_valid()) {
          ago(id(last_feed_ts), buf, sizeof(buf));
          it.print(6, 20, id(font_big), id(c_feed), buf);
        } else {
          it.print(6, 20, id(font_big), id(c_feed), "syncing...");
        }
      } else {
        it.print(6, 20, id(font_big), "no data yet");
      }
      it.print(6, 70, id(font_small), id(c_change), "Diaper");
      if (id(last_change_ts) > 0) {
        if (now.is_valid()) {
          ago(id(last_change_ts), buf, sizeof(buf));
          it.print(6, 90, id(font_big), id(c_change), buf);
        } else {
          it.print(6, 90, id(font_big), id(c_change), "syncing...");
        }
      } else {
        it.print(6, 90, id(font_big), "no data yet");
      }